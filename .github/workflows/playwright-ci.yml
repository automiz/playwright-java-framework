name: Playwright Java CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Lets you trigger runs manually from the GitHub Actions tab

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile test classes
        run: mvn -B test-compile --no-transfer-progress

      - name: Install Playwright browsers & system deps
        run: mvn -B exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium" --no-transfer-progress

      - name: Run Playwright tests
        run: mvn -B test --no-transfer-progress